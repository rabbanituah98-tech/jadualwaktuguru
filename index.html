<style>
:root{
  --bg:#f3f5fb;--card:#ffffff;--card2:#f8fafc;--text:#0f172a;--muted:#64748b;--line:#e3e8f1;
  --accent:#4f46e5;--accent2:#06b6d4;--ok:#16a34a;--warn:#f59e0b;--danger:#e11d48;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px rgba(15,23,42,.07);
  --r:16px;--side:280px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme=dark]{
  --bg:#0a0f1e;--card:#131a2c;--card2:#18213a;--text:#e6e9f2;--muted:#94a3b8;--line:#253150;
  --accent:#818cf8;--accent2:#22d3ee;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45}
body{min-height:100vh;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
.ic{flex:none;display:inline-block;vertical-align:middle}
a{color:var(--accent)}
/* ---------- layout ---------- */
#sidebar{position:fixed;top:0;bottom:0;width:var(--side);background:var(--card);border-right:1px solid var(--line);z-index:60;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-top:var(--safe-t)}
.side-left #sidebar{left:0;transform:translateX(-102%)}
.side-right #sidebar{right:0;border-right:0;border-left:1px solid var(--line);transform:translateX(102%)}
.side-open #sidebar{transform:none!important;box-shadow:0 0 60px rgba(0,0,0,.25)}
#scrim{position:fixed;inset:0;background:rgba(2,6,23,.45);backdrop-filter:blur(2px);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s}
.side-open #scrim{opacity:1;pointer-events:auto}
main{min-height:100vh;transition:margin .3s}
@media(min-width:1100px){
  #sidebar{transform:none!important;box-shadow:none!important}
  #scrim{display:none}
  .side-left main{margin-left:var(--side)}
  .side-right main{margin-right:var(--side)}
  .side-collapsed.side-left #sidebar{transform:translateX(-102%)!important}
  .side-collapsed.side-right #sidebar{transform:translateX(102%)!important}
  .side-collapsed main{margin:0!important}
}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 16px 10px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--line)}
.side-right .topbar{flex-direction:row-reverse}
.side-right .topbar .tb-title{text-align:right}
.tb-title{flex:1;min-width:0}
.tb-title h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title small{color:var(--muted);font-size:12px}
.tb-actions{display:flex;gap:6px;align-items:center}
.side-right .tb-actions{flex-direction:row-reverse}
.chip-clock{font-variant-numeric:tabular-nums;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;transition:.15s;position:relative}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.ibtn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}
.ibtn .dot.off{background:var(--muted)}
#view{padding:18px 16px calc(40px + var(--safe-b));max-width:1500px;margin:0 auto}
@media(max-width:640px){#view{padding:12px 10px calc(40px + var(--safe-b))}.chip-clock .sec{display:none}.hide-sm{display:none!important}}
/* ---------- sidebar ---------- */
.sb-prof{padding:20px 18px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;position:relative}
.sb-prof .x{position:absolute;top:10px;right:10px}
.av{object-position:50% 22%;width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 0 0 3px var(--card),0 0 0 5px color-mix(in srgb,var(--accent) 35%,transparent)}
.sb-prof b{display:block;font-size:14.5px;line-height:1.25}
.sb-prof small{color:var(--muted);font-size:12px;display:block;line-height:1.3;margin-top:2px}
.nav{padding:10px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--text);text-decoration:none;font-weight:600;font-size:14.5px;cursor:pointer;transition:.15s;margin-bottom:2px}
.nav a:hover{background:var(--card2)}
.nav a.on{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
.nav a .bd{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.nav a .bd.w{background:var(--warn)}
.nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:14px 12px 6px}
.sb-foot{padding:12px 14px calc(14px + var(--safe-b));border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.sb-foot select{width:100%;margin-top:6px}
.swipe-hint{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px}
@media(min-width:1100px){.swipe-hint,.sb-prof .x{display:none}}
/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;cursor:pointer;transition:background .15s,border-color .15s,color .15s;position:relative;overflow:hidden;white-space:nowrap;user-select:none;-webkit-user-select:none}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dan{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.ico{padding:7px;width:34px;height:34px}
.btn.armed{background:var(--danger)!important;border-color:var(--danger)!important;color:#fff!important;width:auto!important;padding-left:12px;padding-right:12px;animation:wob .35s}
.btn.pri.armed,.btn.armed.okc{background:var(--ok)!important;border-color:var(--ok)!important}
.btn.armed::after{content:"";position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.85);animation:drain 3s linear forwards}
@keyframes drain{from{width:100%}to{width:0}}
@keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],input[type=search],select,textarea{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card2);outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
textarea{min-height:90px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.fld>span{padding-left:2px}
.fld.full{grid-column:1/-1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:var(--text);cursor:pointer;padding:6px 0}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);color:color-mix(in srgb,var(--c,var(--accent)) 80%,var(--text))}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.empty{text-align:center;padding:30px 14px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:6px}
.sec-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:17px;font-weight:800;flex:1}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;color:#fff;padding:22px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(135deg,#4338ca,#0891b2);box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;background-image:var(--img,none);background-size:cover;background-position:center;opacity:.9}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,.15),rgba(15,23,42,.78))}
.hero>*{position:relative;z-index:1}
.hero-top{position:absolute;top:16px;left:18px;right:18px;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero-logo{position:absolute;right:-30px;top:50%;transform:translateY(-50%) rotate(-8deg);width:260px;height:260px;object-fit:contain;opacity:.13;z-index:0!important;pointer-events:none;border-radius:30px}
.lg{width:22px;height:22px;border-radius:6px;object-fit:contain;background:#fff;padding:1px;vertical-align:middle;flex:none}
.hero .tag .lg{width:24px;height:24px;margin:-4px 2px -4px -6px}
.sb-school{display:flex;align-items:center;gap:6px;margin-top:4px}
.hero .tag{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700}
.hero-top .tag{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:6px;min-width:0}
.hero-top .tag:last-child{flex:none}
@media(max-width:640px){.hero-logo{width:180px;height:180px;right:-40px}.hero-top{left:12px;right:12px}.hero-top .tag{font-size:11px}}
.hero-main{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:44px}
.hero .av{width:78px;height:78px;font-size:26px;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.hero h2{margin:0;font-size:22px;line-height:1.2;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.hero .gr{font-size:13px;opacity:.9;font-weight:600}
.hero .sch{font-size:13px;opacity:.9}
.hero .clk{margin-left:auto;text-align:right}
.hero .clk b{display:block;font-size:40px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.hero .clk small{font-size:13px;opacity:.92;display:block;margin-top:4px}
@media(max-width:640px){.hero{padding:16px;min-height:170px}.hero .clk{margin-left:0;text-align:left;width:100%}.hero .clk b{font-size:34px}.hero h2{font-size:19px}.hero .av{width:62px;height:62px}}
/* ---------- now card ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stat small{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stat b{display:block;font-size:26px;font-weight:800;margin-top:2px}
.stat span{font-size:12px;color:var(--muted)}
.nowwrap{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-top:14px}
@media(max-width:760px){.nowwrap{grid-template-columns:1fr}}
.nowc{border-radius:var(--r);padding:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.nowc.live{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 20%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.nowc .lbl{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.nowc .lbl i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ok));animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.nowc .t{font-size:26px;font-weight:800;margin:4px 0 0;line-height:1.15}
.nowc .s{color:var(--muted);font-size:13.5px;margin-top:2px}
.nowc .cd{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;margin-top:8px;color:color-mix(in srgb,var(--c,var(--accent)) 80%,var(--text))}
.bar{height:8px;border-radius:9px;background:var(--card2);margin-top:10px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--c,var(--accent)),color-mix(in srgb,var(--c,var(--accent)) 60%,#fff));transition:width 1s linear}
/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column;gap:8px}
.tli{display:flex;gap:12px;align-items:stretch;padding:10px 12px;border-radius:13px;background:var(--card2);border:1px solid var(--line);cursor:pointer;transition:.15s;position:relative}
.tli:hover{border-color:var(--c)}
.tli .tm{width:74px;flex:none;font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.3}
.tli .tm b{display:block;color:var(--text);font-size:14px}
.tli .bd{width:4px;border-radius:4px;background:var(--c);flex:none}
.tli .ct{flex:1;min-width:0}
.tli .ct b{display:block;font-size:15px}
.tli .ct small{color:var(--muted)}
.tli.done{opacity:.55}
.tli.live{background:color-mix(in srgb,var(--c) 14%,var(--card));border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.tli.relief .bd{background:repeating-linear-gradient(180deg,var(--c) 0 6px,transparent 6px 10px)}
.tli .st{align-self:center;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.tli.live .st{background:var(--c);color:#fff;border-color:var(--c)}
.banner{border-radius:14px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--c) 14%,var(--card));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));color:color-mix(in srgb,var(--c) 70%,var(--text));margin-bottom:10px}
/* ---------- week grid ---------- */
.wk-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.wk-bar .lab{font-weight:800;font-size:16px;flex:1;min-width:160px}
.wk-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);background:var(--card);-webkit-overflow-scrolling:touch}
.wk{display:grid;position:relative}
.ph{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:var(--card2);font-size:11px;color:var(--muted);line-height:1.25}
.ph b{display:block;font-size:14px;color:var(--text)}
.ph.rh{background:repeating-linear-gradient(45deg,var(--card2) 0 6px,color-mix(in srgb,var(--line) 60%,var(--card2)) 6px 12px)}
.ph.nowc2{background:color-mix(in srgb,var(--accent) 18%,var(--card2));color:var(--accent)}
.ph.nowc2 b{color:var(--accent)}
.ph.corner{position:sticky;left:0;z-index:5;display:flex;align-items:center;justify-content:center;font-weight:800}
.dl{position:sticky;left:0;z-index:4;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px}
.dl b{font-size:18px;font-weight:800}
.dl small{font-size:11px;color:var(--muted);font-weight:700}
.dl.today{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff}
.dl.today small{color:rgba(255,255,255,.9)}
.cell{border-right:1px dashed var(--line);border-bottom:1px solid var(--line);min-height:76px;cursor:pointer;transition:background .15s;position:relative}
.cell.xr{min-height:30px;cursor:default;border-bottom-style:dashed}
.cell.tr{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.cell.rh{background:repeating-linear-gradient(45deg,transparent 0 6px,color-mix(in srgb,var(--line) 45%,transparent) 6px 12px);cursor:default}
.cell.now{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.cell[data-act]:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.cell[data-act]:hover::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;color:var(--accent);font-size:22px;font-weight:800}
.slot{position:relative;z-index:2;margin:4px;border-radius:12px;background:color-mix(in srgb,var(--c) 16%,var(--card));border:1px solid color-mix(in srgb,var(--c) 38%,transparent);border-left:5px solid var(--c);display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:66px;padding:14px 6px;transition:transform .15s,box-shadow .15s}
.slot:hover{transform:translateY(-2px);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 30%,transparent)}
.slot .k{font-weight:800;font-size:16px;color:color-mix(in srgb,var(--c) 72%,var(--text));text-align:center;line-height:1.1}
.slot .s{position:absolute;top:4px;left:7px;font-size:10px;font-weight:800;color:var(--muted)}
.slot .b{position:absolute;bottom:4px;right:7px;font-size:10px;font-weight:700;color:var(--muted)}
.slot.live{box-shadow:0 0 0 2px var(--c),0 0 22px color-mix(in srgb,var(--c) 55%,transparent);animation:glow 2s infinite}
.slot.dim{opacity:.35}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--c),0 0 8px color-mix(in srgb,var(--c) 30%,transparent)}}
.xc{position:relative;z-index:2;margin:3px;border-radius:8px;font-size:11px;font-weight:700;padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:color-mix(in srgb,var(--c) 14%,var(--card));border:1.5px dashed var(--c);color:color-mix(in srgb,var(--c) 75%,var(--text));align-self:center}
.xc.ev{border-style:solid}
.cutiov{z-index:3;display:grid;place-items:center;font-weight:800;letter-spacing:.3em;color:#e11d48;background:color-mix(in srgb,#e11d48 8%,transparent);pointer-events:none;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.legend i{width:11px;height:11px;border-radius:4px;background:var(--c)}
.legend i.ds{background:none;border:2px dashed var(--c)}
.daycards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.daycard h4{margin:0 0 10px;display:flex;align-items:center;gap:8px;font-size:15px}
.daycard.today{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
/* ---------- lists ---------- */
.li{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;box-shadow:var(--shadow)}
.li .db{width:54px;flex:none;text-align:center;border-radius:12px;padding:6px 0;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:color-mix(in srgb,var(--c,var(--accent)) 80%,var(--text))}
.li .db b{display:block;font-size:20px;line-height:1.1;font-weight:800}
.li .db small{font-size:11px;font-weight:800;text-transform:uppercase}
.li .ct{flex:1;min-width:0}
.li .ct b{font-size:15px}
.li .ct .m{font-size:13px;color:var(--muted);margin-top:2px}
.li .ac{display:flex;gap:6px;flex:none}
.li.past{opacity:.6}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.note{background:color-mix(in srgb,var(--c) 12%,var(--card));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));border-top:5px solid var(--c);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;cursor:pointer}
.note b{font-size:15px;display:flex;gap:6px;align-items:flex-start}
.note p{margin:0;white-space:pre-wrap;font-size:14px;color:color-mix(in srgb,var(--text) 85%,var(--muted));max-height:220px;overflow:auto}
.note .ft{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:6px;font-size:12px;color:var(--muted)}
.note .ft .sp{flex:1}
table.tb{width:100%;border-collapse:separate;border-spacing:0}
table.tb th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line)}
table.tb td{padding:8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
table.tb tr:last-child td{border-bottom:0}
.tbwrap{overflow-x:auto}
.cdot{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--c);vertical-align:middle;margin-right:6px}
.colorrow{display:flex;flex-wrap:wrap;gap:8px}
.colorrow label{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:800;cursor:pointer}
.colorrow input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;border-radius:8px;cursor:pointer}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:30px;height:30px;border-radius:9px;border:2px solid transparent;background:var(--c);cursor:pointer}
.swatches button.on{border-color:var(--text);box-shadow:0 0 0 2px var(--card) inset}
.imgbox{border:2px dashed var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.imgbox img{max-width:100%;max-height:170px;border-radius:12px;object-fit:cover}
.imgbox .ph0{width:120px;height:120px;border-radius:16px;background:var(--card2);display:grid;place-items:center;color:var(--muted);font-size:40px}
.imgbox.logo img{object-fit:contain;background:#fff;width:150px;height:150px;padding:6px}
.imgbox.round img{object-position:50% 22%}
.imgbox.round img,.imgbox.round .ph0{width:130px;height:130px;border-radius:50%}
/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,6,23,.5);backdrop-filter:blur(3px)}
#modal.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mbox{background:var(--card);border-radius:20px;width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);border:1px solid var(--line);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(20px) scale(.97);opacity:0}}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:17px;flex:1}
.mb{padding:16px 18px;overflow:auto}
.mf{display:flex;gap:8px;padding:12px 18px calc(12px + var(--safe-b));border-top:1px solid var(--line);flex-wrap:wrap}
.mf .sp{flex:1}
.hint{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:10px}
@media(max-width:640px){#modal{align-items:flex-end;padding:0}.mbox{border-radius:20px 20px 0 0;max-height:92vh}}
/* ---------- toast ---------- */
#toasts{position:fixed;z-index:200;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,calc(100% - 24px));pointer-events:none}
.toast{pointer-events:auto;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:flex-start;width:100%;animation:tin .3s cubic-bezier(.2,.9,.3,1.2)}
.toast.err{background:var(--danger);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
.toast.ntf{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.toast b{display:block}
.toast small{opacity:.9;font-weight:500}
@keyframes tin{from{transform:translateY(20px);opacity:0}}
/* ---------- date picker ---------- */
.dp{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;padding:7px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);transition:.15s;max-width:100%}
.dp:hover,.dp:focus-within{border-color:var(--accent);color:var(--accent)}
.dp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp input,.tbd input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0;font-size:16px;-webkit-appearance:none;appearance:none;z-index:2}
.wk-bar .lab.dp{flex:0 1 auto}
.wk-bar .sp{flex:1}
.tbd{position:relative;display:inline-flex;align-items:center;gap:3px;cursor:pointer;border-radius:6px}
.side-right .tbd{flex-direction:row-reverse}
.tbd:hover small{color:var(--accent)}
.dl.sel{box-shadow:inset 0 0 0 3px var(--warn)}
.dl.sel small{color:var(--warn)}
.daycard.sel{border-color:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 40%,transparent)}
/* ---------- print ---------- */
.print-only{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}
  :root,[data-theme=dark]{--bg:#fff;--card:#fff;--card2:#f6f7fb;--text:#000;--muted:#444;--line:#999;--shadow:none}
  html,body{background:#fff!important;font-size:11px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #sidebar,#scrim,.topbar,#toasts,#modal,.no-print,.wk-bar,.ac,.sec-h .btn,.seg{display:none!important}
  main{margin:0!important}
  #view{padding:0;max-width:none}
  .print-only{display:block}
  .wk-wrap{overflow:visible;box-shadow:none;border:1px solid #000;border-radius:0}
  .wk{min-width:0!important}
  .cell{min-height:58px;border-color:#999}
  .slot{min-height:50px;margin:2px;border-radius:6px;box-shadow:none!important;animation:none!important;transform:none!important}
  .slot .k{font-size:13px}
  .dl.today{background:#fff!important;color:#000!important}
  .cell.now,.cell.tr{background:none!important}
  .ph.nowc2{background:var(--card2)!important;color:var(--muted)!important}.ph.nowc2 b{color:#000!important}
  .li,.note,.card,.stat{box-shadow:none;break-inside:avoid}
  .legend span{border-color:#999}
}
.phd{display:flex;align-items:center;gap:14px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
.phd img{width:58px;height:58px;object-fit:cover;border-radius:8px}
.phd h2{margin:0;font-size:16px}
.phd p{margin:2px 0 0;font-size:11px}
.phd .r{margin-left:auto;text-align:right;font-size:11px}
.psig{display:flex;justify-content:space-between;margin-top:22px;font-size:11px}
.psig div{width:240px;text-align:center}
.psig .ln{border-top:1px dotted #000;margin-top:38px;padding-top:4px}
</style>
</head>

function toast(title,body,type,ms){const t=document.createElement('div');t.className='toast '+(type||'');t.innerHTML=`<div style="flex:1"><b>${esc(title)}</b>${body?`<small>${esc(body)}</small>`:''}</div>`;$('#toasts').appendChild(t);t.onclick=()=>t.remove();setTimeout(()=>{t.style.transition='.3s';t.style.opacity=0;setTimeout(()=>t.remove(),300)},ms||3200)}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext;const a=new A();[0,.25].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=d?1175:880;g.gain.setValueAtTime(.0001,a.currentTime+d);g.gain.exponentialRampToValueAtTime(.25,a.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d+.35);o.start(a.currentTime+d);o.stop(a.currentTime+d+.4)})}catch(e){}}

async function sysNotify(title,body){
  if(!('Notification' in window)||Notification.permission!=='granted')return false;
  try{if(swReg){await swReg.showNotification(title,{body,icon:'icon-512.png',badge:'icon-512.png',tag:title+body,vibrate:[200,100,200]});return true}}catch(e){}
  try{new Notification(title,{body});return true}catch(e){return false}
}

function checkNotify(now){
  const N=S.settings.notify;if(!N.on)return;
  const key=dk(now),sec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  let fired={};try{fired=JSON.parse(localStorage.getItem(FKEY)||'{}')}catch(e){}
  if(fired.d!==key)fired={d:key,k:[]};
  let changed=false;
  itemsFor(now).items.forEach(it=>{
    if(!it.mula)return;if(it.type==='kelas'&&!N.kelas)return;if(it.type==='relief'&&!N.relief)return;if(it.type==='acara'&&!N.acara)return;
    const diff=t2m(it.mula)*60-sec, k=it.type+it.id;
    if(diff>0&&diff<=N.min*60&&!fired.k.includes(k)){fired.k.push(k);changed=true;
      const lbl={kelas:'Kelas',relief:'Relief',acara:'Acara'}[it.type];
      notifyNow(`${lbl}: ${it.title} — ${Math.ceil(diff/60)} minit lagi`,`${fmtR(it.mula,it.tamat)}${it.sub?' · '+it.sub:''}`)}
  });
  if(changed)localStorage.setItem(FKEY,JSON.stringify(fired));
}

function showModal(html){modal.innerHTML=html;modal.classList.add('on');document.body.classList.add('modal-open')}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalOpen())closeModal();else if(!isDesk())closeSide()}});
function fieldHTML(f,v){
  const id='f_'+f.k;v=v??f.def??'';const w=f.full?' full':'';
  if(f.t==='select')return `<label class="fld${w}"><span>${f.l}</span><select id="${id}">${f.opts.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}"${String(val)===String(v)?' selected':''}>${esc(lab)}</option>`}).join('')}</select></label>`;
  if(f.t==='textarea')return `<label class="fld full"><span>${f.l}</span><textarea id="${id}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea></label>`;
  if(f.t==='check')return `<label class="chk${w}"><input type="checkbox" id="${id}"${v?' checked':''}> ${f.l}</label>`;
  if(f.t==='swatch')return `<div class="fld full"><span>${f.l}</span><div class="swatches" id="${id}" data-v="${esc(v)}">${f.opts.map(c=>`<button type="button" style="--c:${c}" class="${c===v?'on':''}" data-sw="${c}" aria-label="${c}"></button>`).join('')}${f.custom?`<input type="color" value="${esc(v||f.opts[0])}" data-swc style="width:30px;height:30px;border:0;padding:0;background:none">`:''}</div></div>`;
  if(f.t==='info')return `<div class="fld full hint" style="margin:0">${ico('info',14)} ${f.l}</div>`;
  return `<label class="fld${w}"><span>${f.l}${f.req?' *':''}</span><input type="${f.t||'text'}" id="${id}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"${f.list?` list="dl_${f.k}"`:''}${f.t==='number'?` min="${f.min??''}" max="${f.max??''}"`:''}>${f.list?`<datalist id="dl_${f.k}">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}</label>`;
}
function readForm(fields){const o={};fields.forEach(f=>{const el=$('#f_'+f.k);if(!el)return;if(f.t==='check')o[f.k]=el.checked;else if(f.t==='swatch')o[f.k]=el.dataset.v;else if(f.t==='number')o[f.k]=el.value===''?'':Number(el.value);else if(f.t!=='info')o[f.k]=el.value.trim()});return o}
function openForm({title,icon,fields,data,onSave,onDelete,validate,saveLabel}){
  data=data||{};
  showModal(`<div class="mbox"><div class="mh">${ico(icon||'edit')}<h3>${esc(title)}</h3><button class="ibtn" data-x style="width:36px;height:36px">${ico('x',18)}</button></div>
  <div class="mb"><div class="fgrid">${fields.map(f=>fieldHTML(f,data[f.k])).join('')}</div>
  <div class="hint">${ico('hand',14)} Tekan butang Simpan / Padam <b>2 kali</b> untuk pengesahan.</div></div>
  <div class="mf">${onDelete?`<button class="btn dan" data-del>${ico('trash',16)} Padam</button>`:''}<span class="sp"></span><button class="btn" data-x>Batal</button><button class="btn pri" data-save>${ico('check',16)} ${saveLabel||'Simpan'}</button></div></div>`);
  modal.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeModal);
  modal.querySelectorAll('.swatches').forEach(sw=>sw.addEventListener('click',e=>{const b=e.target.closest('[data-sw]');if(!b)return;sw.dataset.v=b.dataset.sw;sw.querySelectorAll('[data-sw]').forEach(x=>x.classList.toggle('on',x===b))}));
  modal.querySelectorAll('[data-swc]').forEach(inp=>inp.addEventListener('input',()=>{const sw=inp.closest('.swatches');sw.dataset.v=inp.value;sw.querySelectorAll('[data-sw]').forEach(x=>x.classList.remove('on'))}));
  const sb=modal.querySelector('[data-save]');
  sb.onclick=()=>{
    const vals=readForm(fields);
    if(!sb.classList.contains('armed')){
      const miss=fields.find(f=>f.req&&!String(vals[f.k]??'').trim());
      if(miss){toast('Sila isi: '+miss.l,'','err');$('#f_'+miss.k)?.focus();return}
      const err=validate&&validate(vals);if(err){toast(err,'','err');return}
    }
    arm(sb,()=>{if(onSave(vals)!==false){save();closeModal();render();toast('Disimpan','','ok',1800)}},'Tekan lagi untuk simpan');
  };
  const db=modal.querySelector('[data-del]');
  if(db)db.onclick=()=>arm(db,()=>{onDelete();save();closeModal();render();toast('Dipadam','','ok',1800)},'Tekan lagi untuk padam');
  setTimeout(()=>{const f=modal.querySelector('input[type=text],input[type=date]');if(f&&innerWidth>700)f.focus()},50);
}
function openConfirm(title,msg,label,fn,icon){
  showModal(`<div class="mbox" style="width:min(440px,100%)"><div class="mh">${ico(icon||'info')}<h3>${esc(title)}</h3></div><div class="mb">${msg}</div>
  <div class="mf"><span class="sp"></span><button class="btn" data-x>Batal</button><button class="btn dan" data-ok>${esc(label)}</button></div></div>`);
  modal.querySelector('[data-x]').onclick=closeModal;
  const b=modal.querySelector('[data-ok]');b.onclick=()=>arm(b,()=>{closeModal();fn()});
}

function vToday(){
  const now=new Date(),P=S.profile,{items,cuti}=itemsFor(now),st=cur();
  const nm=now.getHours()*60+now.getMinutes();
  const isWork=S.settings.days.includes(now.getDay());
  const kelasToday=items.filter(i=>i.type==='kelas');
  const minsToday=kelasToday.reduce((a,i)=>a+(t2m(i.tamat)-t2m(i.mula)),0);
  const weekTotal=st.slots.filter(s=>S.settings.days.includes(s.hari)).reduce((a,s)=>a+(t2m(s.tamat)-t2m(s.mula)),0);
  const per=st.periods.length?(t2m(st.periods[0].tamat)-t2m(st.periods[0].mula)):30;
  const ym=dk(now).slice(0,7);const rMonth=S.relief.filter(r=>r.tarikh.startsWith(ym)).length;
  const todayK=dk(now),wk=dk(addDays(now,7));
  const evSoon=S.acara.filter(a=>(a.tarikhTamat||a.tarikh)>=todayK&&a.tarikh<=wk);
  const tl=items.map(it=>{const a=it.mula?t2m(it.mula):null,b=it.tamat?t2m(it.tamat):null;
    const stt=a==null?'live':(b!=null&&nm>=b?'done':(nm>=a&&(b==null||nm<b)?'live':'next'));
    const act={kelas:'editSlot',relief:'editRelief',acara:'editAcara'}[it.type];
    return `<div class="tli ${stt==='done'?'done':''} ${stt==='live'&&a!=null?'live':''} ${it.type}" style="--c:${it.c}" data-act="${act}" data-id="${it.id}">
      <div class="tm"><b>${it.mula?fmtS(it.mula):'—'}</b>${it.tamat?fmtS(it.tamat):(it.mula?'':'Sepanjang hari')}</div><div class="bd"></div>
      <div class="ct"><b>${esc(it.title)}</b><small>${esc(it.sub)}</small></div>
      <span class="st">${a==null?'Hari ini':stt==='done'?'Selesai':stt==='live'?'Sedang':'Akan datang'}</span></div>`}).join('');
  let nextDayHTML='';
  if(!kelasToday.length&&!cuti){for(let i=1;i<=7;i++){const d=addDays(now,i);const r=itemsFor(d);if(r.items.some(x=>x.type==='kelas')){nextDayHTML=`<div class="card" style="margin-top:12px"><h3>${ico('cal',18)} Kelas seterusnya: ${dLong(d)}</h3><div class="tl">${r.items.map(it=>`<div class="tli" style="--c:${it.c}"><div class="tm"><b>${it.mula?fmtS(it.mula):'—'}</b>${fmtS(it.tamat)}</div><div class="bd"></div><div class="ct"><b>${esc(it.title)}</b><small>${esc(it.sub)}</small></div></div>`).join('')}</div></div>`;break}}}
  const upcoming=S.acara.filter(a=>(a.tarikhTamat||a.tarikh)>=todayK).sort((a,b)=>(a.tarikh+(a.mula||'')).localeCompare(b.tarikh+(b.mula||''))).slice(0,5);
  const upR=S.relief.filter(r=>r.tarikh>todayK).sort((a,b)=>(a.tarikh+a.mula).localeCompare(b.tarikh+b.mula)).slice(0,4);
  const pins=S.nota.filter(n=>n.pin);
  return `
  <div class="hero" ${P.gambarSekolah?`style="--img:url('${cssUrl(P.gambarSekolah)}')"`:''}>
    <div class="hero-top"><span class="tag">${P.logo?logoImg():ico('school',14)} ${esc(P.sekolah||'Sekolah anda')}</span><span class="tag">${esc(st.nama)}</span></div>
    ${P.logo&&!P.gambarSekolah?logoImg('hero-logo'):''}
    <div class="hero-main">${avatar()}
      <div><div class="gr">${greet(now.getHours())},</div><h2>${esc(P.panggilan||P.nama||'Cikgu')}</h2><div class="sch">${esc(P.jawatan||'')}</div></div>
      <div class="clk"><b data-live="clock">${clockStr(now)}</b><small>${dLong(now)}</small><small>${hijri(now)}</small></div>
    </div>
  </div>
  <div class="nowwrap" id="nowCard">${nowCardHTML(now)}</div>
  <div class="stats">
    <div class="stat"><small>Hari ini</small><b>${kelasToday.length}</b><span>slot · ${Math.round(minsToday/per)} waktu (${(minsToday/60).toFixed(1)} jam)</span></div>
    <div class="stat"><small>Seminggu</small><b>${Math.round(weekTotal/per)}</b><span>waktu mengajar · ${(weekTotal/60).toFixed(1)} jam</span></div>
    <div class="stat" data-act="go" data-v="relief" style="cursor:pointer"><small>Relief bulan ini</small><b style="color:${RELIEF_C}">${rMonth}</b><span>${MONTHS[now.getMonth()]}</span></div>
    <div class="stat" data-act="go" data-v="acara" style="cursor:pointer"><small>Acara 7 hari</small><b style="color:${EVT.Mesyuarat}">${evSoon.length}</b><span>mesyuarat / program</span></div>
  </div>
  <div class="sec-h"><h2>Jadual hari ini</h2>
    <button class="btn sm" data-act="addRelief">${ico('plus',16)} Relief</button>
    <button class="btn sm" data-act="addAcara">${ico('plus',16)} Acara</button>
    <button class="btn sm" data-act="addNota">${ico('plus',16)} Catatan</button></div>
  ${cuti?`<div class="banner" style="--c:${EVT.Cuti}">${ico('cal')} ${esc(cuti.tajuk)} — tiada kelas hari ini</div>`:''}
  ${tl?`<div class="tl">${tl}</div>`:`<div class="card empty"><div class="big">${isWork?'☕':'🌴'}</div>${cuti?'Selamat bercuti!':isWork?'Tiada kelas atau acara hari ini.':'Hujung minggu — tiada kelas.'}</div>`}
  ${nextDayHTML}
  <div class="grid2" style="margin-top:16px">
    <div class="card"><h3>${ico('cal',18)} Acara akan datang<span class="sp"></span><button class="btn sm" data-act="go" data-v="acara">Semua</button></h3>
      ${upcoming.length?upcoming.map(acaraLi).join(''):'<div class="empty">Tiada mesyuarat / program dirancang.</div>'}</div>
    <div class="card"><h3>${ico('swap',18)} Relief akan datang<span class="sp"></span><button class="btn sm" data-act="go" data-v="relief">Semua</button></h3>
      ${upR.length?upR.map(reliefLi).join(''):'<div class="empty">Tiada relief akan datang.</div>'}</div>
  </div>
  ${pins.length?`<div class="sec-h"><h2>${ico('pin',18)} Catatan disematkan</h2></div><div class="notes">${pins.map(noteCard).join('')}</div>`:''}`;
}
function clockStr(d){if(S.settings.jam24)return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;const h=d.getHours();return `${h%12||12}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${h<12?'PG':'PTG'}`}
function nowCardHTML(now){

  const timed=items.filter(i=>i.mula&&i.tamat);
  const curI=timed.filter(i=>t2m(i.mula)*60<=sec&&sec<t2m(i.tamat)*60).sort((a,b)=>(a.type==='acara')-(b.type==='acara'))[0];
  const nxt=timed.filter(i=>t2m(i.mula)*60>sec)[0];
  let a,b;
  if(curI){const s0=t2m(curI.mula)*60,s1=t2m(curI.tamat)*60;const pc=Math.min(100,(sec-s0)/(s1-s0)*100);

function gridHTML(days,ws){
  const st=cur(),P=st.periods,N=P.length,now=new Date(),todayK=dk(now),nm=now.getHours()*60+now.getMinutes();
  const thisWeek=dk(weekStart(now))===dk(ws);
  let h=`<div class="ph corner" style="grid-row:1;grid-column:1">Hari</div>`;
  P.forEach((p,i)=>{const isNow=thisWeek&&S.settings.days.includes(now.getDay())&&nm>=t2m(p.mula)&&nm<t2m(p.tamat);
    h+=`<div class="ph${p.label?' rh':''}${isNow?' nowc2':''}" style="grid-row:1;grid-column:${i+2}"><b>${p.label?esc(p.label):i+1}</b>${fmtS(p.mula)}<br>${fmtS(p.tamat)}</div>`});
  let r=2;
  days.forEach(d=>{
    const date=dateOf(ws,d),key=dk(date),isT=key===todayK,cuti=isCuti(key);
    const X=[];
    if(UI.showX){
      S.relief.filter(x=>x.tarikh===key).forEach(x=>{const sp=span(x.mula,x.tamat,P);if(sp)X.push({s:sp[0],e:sp[1],c:RELIEF_C,act:'editRelief',id:x.id,ev:0,t:`⇄ ${x.kelas}${x.subjek?' · '+x.subjek:''}`})});
      S.acara.filter(a=>inRange(key,a)&&a.jenis!=='Cuti').forEach(a=>{const sp=a.mula?span(a.mula,a.tamat||m2t(t2m(a.mula)+30),P):[0,N-1];if(sp)X.push({s:sp[0],e:sp[1],c:EVT[a.jenis]||EVT['Lain-lain'],act:'editAcara',id:a.id,ev:1,t:`${a.jenis}: ${a.tajuk}`})});
    }
    const nL=lanes(X);
    h+=`<div class="dl${isT?' today':''}${key===UI.selDate?' sel':''}" style="grid-row:${r}/span ${1+nL};grid-column:1"><b>${DAYS_S[d]}</b><small>${date.getDate()}/${date.getMonth()+1}</small></div>`;
    for(let L=0;L<=nL;L++)P.forEach((p,i)=>{const isNow=isT&&L===0&&nm>=t2m(p.mula)&&nm<t2m(p.tamat);
      h+=`<div class="cell${L?' xr':''}${p.label?' rh':''}${isNow?' now':''}${isT?' tr':''}" style="grid-row:${r+L};grid-column:${i+2}"${L===0&&!p.label?` data-act="addSlot" data-hari="${d}" data-mula="${p.mula}"`:''}></div>`});
    if(cuti)h+=`<div class="cutiov" style="grid-row:${r};grid-column:2/${N+2}">CUTI · ${esc(cuti.tajuk)}</div>`;
    st.slots.filter(s=>s.hari===d).forEach(s=>{const sp=span(s.mula,s.tamat,P);if(!sp)return;const live=isT&&!cuti&&nm>=t2m(s.mula)&&nm<t2m(s.tamat);
      h+=`<div class="slot${live?' live':''}${cuti?' dim':''}" style="--c:${colorOf(s.kelas)};grid-row:${r};grid-column:${sp[0]+2}/${sp[1]+3}" data-act="editSlot" data-id="${s.id}" title="${esc(s.kelas)} · ${esc(s.subjek)} · ${fmtR(s.mula,s.tamat)}">${s.subjek?`<span class="s">${esc(s.subjek)}</span>`:''}<span class="k">${esc(s.kelas)}</span>${s.bilik?`<span class="b">${esc(s.bilik)}</span>`:''}</div>`});
    X.forEach(x=>h+=`<div class="xc${x.ev?' ev':''}" style="--c:${x.c};grid-row:${r+1+x.lane};grid-column:${x.s+2}/${x.e+3}" data-act="${x.act}" data-id="${x.id}" title="${esc(x.t)}">${esc(x.t)}</div>`);
    r+=1+nL;
  });
  return `<div class="wk-wrap" data-noswipe><div class="wk" style="grid-template-columns:62px repeat(${N},minmax(58px,1fr));min-width:${62+N*60}px">${h}</div></div>`;
}

function hexRgb(h){h=String(h||'#888').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16)||0;return[(n>>16)&255,(n>>8)&255,n&255]}
const mixW=(h,t)=>{const[r,g,b]=hexRgb(h);return `rgb(${Math.round(r*t+255*(1-t))},${Math.round(g*t+255*(1-t))},${Math.round(b*t+255*(1-t))})`};
const dark=(h,t)=>{const[r,g,b]=hexRgb(h);return `rgb(${Math.round(r*t)},${Math.round(g*t)},${Math.round(b*t)})`};
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fit(c,t,w){t=String(t??'');if(c.measureText(t).width<=w)return t;while(t.length>1&&c.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'}
function wrapL(c,t,w,max){const out=[];String(t??'').split('\n').forEach(par=>{let line='';par.split(/\s+/).filter(Boolean).forEach(wd=>{const tt=line?line+' '+wd:wd;if(c.measureText(tt).width>w&&line){out.push(line);line=wd}else line=tt});out.push(line)});
  while(out.length>1&&out[out.length-1]==='')out.pop();if(out.length>max){out.length=max;out[max-1]=fit(c,out[max-1]+'…',w)}return out.map(l=>fit(c,l,w))}

function newPage(PW,PH){const cv=document.createElement('canvas');cv.width=PW*PK;cv.height=PH*PK;const c=cv.getContext('2d');c.scale(PK,PK);c.fillStyle='#fff';c.fillRect(0,0,PW,PH);c.textBaseline='top';return{cv,c,PW,PH}}

function makePDF(cvs,PWpt,PHpt){
  const enc=s=>{const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&255;return a};
  const parts=[],offs=[];let len=0;const push=x=>{const b=typeof x==='string'?enc(x):x;parts.push(b);len+=b.length};
  const obj=(id,fn)=>{offs[id]=len;push(id+' 0 obj\n');fn();push('\nendobj\n')};
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');const n=cvs.length;
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Kids [${cvs.map((_,i)=>(3+3*i)+' 0 R').join(' ')}] /Count ${n} >>`));
  cvs.forEach((cv,i)=>{const id=3+3*i,pw=cv.width/PK,ph=cv.height/PK;
    const b64=cv.toDataURL('image/jpeg',.92).split(',')[1],bin=atob(b64),jpg=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)jpg[j]=bin.charCodeAt(j);
    obj(id,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${id+2} 0 R >> >> /Contents ${id+1} 0 R >>`));
    const cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;obj(id+1,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(id+2,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push('\nendstream')})});
  const tot=3+3*n,xr=len;let x=`xref\n0 ${tot}\n0000000000 65535 f \n`;for(let i=1;i<tot;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size ${tot} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}

}
